permissions_initial_title=Gerekli İzinler
permissions_initial_description=Uygulamanın eksiksiz çalışabilmesi için birkaç temel izne ihtiyacı var. Sonraki ekranda her iznin ne amaçla istendiğini görebilir ve onaylayabilirsiniz.
permissions_done_title=Her Şey Hazır\!
permissions_done_description=Tüm hazırlıklar tamamlandı. Gerekli izinler verildi; uygulamayı artık keyifle kullanabilirsiniz.
permissions_manage_storage_title=Depolama erişimini yönet
permissions_manage_storage_reason=Bu izin; uygulamanın indirme klasörünü değiştirebilmesini, mükerrer indirmeleri daha doğru tespit etmesini ve ek özelliklerin çalışmasını sağlar. İsteğe bağlıdır ancak en iyi deneyim için önerilir.
permission_read_write_external_storage_title=Depolama okuma ve yazma izni
permission_read_write_external_storage_reason=Bu izin; indirilen dosyaların kaydedilmesini, yönetilmesini, kayıt konumunun değiştirilmesini ve aynı dosyanın tekrar indirilmesini engellemeyi sağlar.
permissions_post_notification_title=Bildirim Gönderme
permissions_post_notification_reason=Uygulama, indirmelerinizi aksatmamak adına arka planda çalışır. Bildirimler, indirme durumundan haberdar olmanızı ve arka plan işlemlerinin kesilmemesini sağlar.
permissions_ignore_battery_optimization_title=Pil Tasarrufunu Yoksay
permissions_ignore_battery_optimization_reason=Bazı cihazlar pil tasarrufu için arka plan uygulamalarını agresif biçimde sonlandırır; bu da uygulama ekranda değilken indirmelerin durmasına yol açabilir. İndirmelerinizin kesilmeden sürmesi için uygulamayı pil optimizasyonundan muaf tutabilirsiniz.
