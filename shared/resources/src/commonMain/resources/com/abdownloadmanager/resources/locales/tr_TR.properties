download_error=İndirme Hatası
download_error_reason_http_4xx_title=İstek Başarısız Oldu
download_error_reason_http_4xx_description=Sunucu; geçersiz istek, eksik yetki veya hatalı adres gibi istemci kaynaklı bir sorun nedeniyle indirme talebini reddetti.
download_error_reason_http_4xx_suggestion=İndirme bağlantısını, oturum açma durumunuzu veya erişim izinlerinizi kontrol edin.
download_error_reason_http_401_title=Kimlik Doğrulaması Gerekiyor
download_error_reason_http_401_description=Sunucu indirmeye izin vermeden önce oturum açmanızı istiyor. Mevcut oturum bilgileriniz geçersiz veya eksik.
download_error_reason_http_401_suggestion=Tarayıcınızdan siteye giriş yapıp indirme bağlantısını yenileyin ya da uygulamaya hesap bilgilerinizi girin.
download_error_reason_http_403_title=Erişim Engellendi
download_error_reason_http_403_description=Sunucu bu dosyaya erişmenizi engelliyor. İzniniz yetersiz olabilir, bölge kısıtlamasına takılmış olabilirsiniz veya indirme bağlantısının süresi dolmuş olabilir.
download_error_reason_http_403_suggestion=Dosyaya erişim yetkiniz olduğundan ve bağlantının güncel olduğundan emin olun.
download_error_reason_http_404_title=Dosya Bulunamadı
download_error_reason_http_404_description=İstenen dosya sunucuda bulunamadı. Silinmiş, adı değiştirilmiş veya farklı bir konuma taşınmış olabilir.
download_error_reason_http_404_suggestion=İndirme adresini kontrol edin veya kaynak siteden bağlantıyı tazeleyip uygulamada güncelleyin.
download_error_reason_http_407_title=Proxy Kimlik Doğrulaması Gerekli
download_error_reason_http_407_description=Kullandığınız vekil sunucu (proxy), isteği iletmeden önce kullanıcı adı ve şifre doğrulaması istiyor.
download_error_reason_http_407_suggestion=Ayarlardan proxy giriş bilgilerinizi kontrol edin ya da proxy gerekmiyorsa devre dışı bırakın.
download_error_reason_http_429_title=Çok Fazla İstek Yapıldı
download_error_reason_http_429_description=Kısa sürede çok fazla indirme isteği gönderildiği için sunucu erişiminizi geçici olarak kısıtladı.
download_error_reason_http_429_suggestion=Bir süre bekleyip tekrar deneyin veya aynı anda yapılan indirme ve bağlantı kanalı sayısını düşürün.
download_error_reason_http_5xx_title=Sunucu Hatası
download_error_reason_http_5xx_description=İndirme sırasında karşı sunucuda dahili bir sorun meydana geldi. Bu durum genellikle geçicidir ve sizin cihazınızla ilgili değildir.
download_error_reason_http_5xx_suggestion=Bir süre sonra tekrar deneyin.
download_error_reason_http_503_title=Hizmet Kullanılamıyor
download_error_reason_http_503_description=Sunucu aşırı yoğunluk veya planlı bakım nedeniyle şu anda yanıt veremiyor.
download_error_reason_http_503_suggestion=Bir süre bekleyip tekrar deneyin veya sunucunun durum sayfasını kontrol edin.
download_error_reason_http_default_title=İndirme Başarısız Oldu
download_error_reason_http_default_description=Sunucu beklenmeyen bir yanıt kodu döndürdü\: {{statusCode}} - {{statusMessage}}
download_error_reason_http_default_suggestion=Bir süre sonra tekrar deneyin veya indirme bağlantısını doğrulayın. VPN ya da proxy kullanıyorsanız kapatmayı deneyebilirsiniz. Sorunun devam etmesi durumunda lütfen bize bildirin.
download_error_reason_changed_etag_title=Dosya Değişti (ETag Uyuşmazlığı)
download_error_reason_changed_etag_description=İndirme başladıktan sonra sunucudaki dosya güncellenmiş (yeni bir ETag değeri tespit edildi). Daha önce indirilen kısım yeni dosyayla uyuşmayabilir.\n\nÖnceki ETag\: {{oldETag}}\nGüncel ETag\: {{newETag}}
download_error_reason_changed_etag_suggestion=Dosya bütünlüğünü korumak için indirmeyi baştan başlatın.
download_error_reason_changed_size_title=Dosya Boyutu Değişti
download_error_reason_changed_size_description=Beklenen dosya boyutu ile sunucunun bildirdiği güncel boyut uyuşmuyor. Bu durum dosyanın güncellendiğini veya değiştirildiğini gösterir.\n\nÖnceki boyut\: {{oldSize}}\nGüncel boyut\: {{newSize}}
download_error_reason_changed_size_suggestion=Dosyanın doğru sürümünü indirmek için indirmeyi baştan başlatın.
download_error_reason_changed_web_title=Beklenmeyen Web Sayfası Yanıtı
download_error_reason_changed_web_description=Sunucu dosya yerine bir web sayfası (HTML) döndürdü.
download_error_reason_changed_web_suggestion=Bu durum geçici olabilir. Süresi dolmuş olabileceğinden indirme bağlantısını yenilemeyi deneyin.
download_error_reason_no_space_title=Yetersiz Disk Alanı
download_error_reason_no_space_description=İndirmeyi tamamlamak için diskte yeterli boş alan yok. İndirme için {{required}} gerekiyor ancak seçilen sürücüde yalnızca {{available}} yer var.
download_error_reason_no_space_suggestion=Diskinizde yer açıp indirmeyi tekrar başlatın.
download_error_reason_destination_title=Yazma Hatası
download_error_reason_destination_description=Aşağıdaki nedenden ötürü indirme konumuna dosya yazılamıyor\:\n\nHata\: {{exceptionName}}\nDetay\: {{exceptionMessage}}
download_error_reason_destination_suggestion=Farklı bir indirme klasörü seçin veya klasör izinlerini kontrol edin. Uygulamanın bu konuma yazma yetkisi olduğundan emin olun.
download_error_reason_server_resume_change_title=Kaldığı Yerden Devam Etme Artık Desteklenmiyor
download_error_reason_server_resume_change_description=Sunucu artık bu indirmeye kaldığı yerden devam etme imkânı sunmuyor.
download_error_reason_server_resume_change_suggestion=Tekrar deneyin; sorun sürerse indirmeyi baştan başlatmanız gerekebilir.
download_error_reason_timeout_title=Bağlantı Zaman Aşımına Uğradı
download_error_reason_timeout_description=Sunucu çok uzun süre yanıt vermedi ve bağlantı koptu. Bu durum genellikle yavaş internet, sunucu yoğunluğu veya dengesiz ağ koşullarından kaynaklanır.
download_error_reason_timeout_suggestion=İnternet bağlantınızı kontrol edip tekrar deneyin.
download_error_reason_unknown_host_title=Sunucu Bulunamadı
download_error_reason_unknown_host_description=Sunucu adresi çözümlenemedi. Alan adı hatalı olabilir, sunucu çökmüş olabilir veya ağınızda bir DNS sorunu yaşanıyor olabilir.
download_error_reason_unknown_host_suggestion=İnternete bağlı olduğunuzdan emin olun, indirme adresini kontrol edip tekrar deneyin. Sorun sürerse farklı bir ağa bağlanmayı deneyebilirsiniz.
download_error_reason_connection_reset_title=Bağlantı Sıfırlandı
download_error_reason_connection_reset_description=Dosya indirilirken bağlantı beklenmedik şekilde kesildi. Bu sorun genellikle ağdaki dalgalanmalardan, sunucu kesintisinden veya güvenlik duvarı (firewall) engellemesinden kaynaklanır.
download_error_reason_connection_reset_suggestion=İnternet bağlantınızı kontrol edip tekrar deneyin. VPN ya da proxy kullanıyorsanız kapatmayı deneyin. Sorun devam ederse sunucu kaynaklı olabilir.
download_error_reason_ssl_verification_failed_title=Güvenli Bağlantı Kurulamadı
download_error_reason_ssl_verification_failed_description=SSL sertifikası doğrulanamadığı için güvenli bağlantı sağlanamadı. Bu durum sistem saatinizin yanlış olmasından, sunucunun hatalı yapılandırılmış sertifikasından ya da ağa müdahale girişiminden kaynaklanabilir.
download_error_reason_ssl_verification_failed_suggestion=Sisteminizin tarih ve saatini kontrol edin.\nHTTPS trafiğini denetleyen bir antivirüs, VPN veya proxy kullanıyorsanız devre dışı bırakmayı deneyin.\nSorun sürerse sunucunun sertifikası geçersiz olabilir.\n\nSon çare olarak (önerilmez), ayarlardan "SSL Sertifikalarını Yoksay" seçeneğini açabilirsiniz.\nBu seçenek güvenliği düşürür ve yalnızca kaynağa tamamen güveniyorsanız kullanılmalıdır.
download_error_reason_default_title=Bir Şeyler Ters Gitti
download_error_reason_default_description=Dosya indirilirken beklenmedik bir hata oluştu.\n\nHata\: {{exceptionName}}\nDetay\: {{exceptionMessage}}
download_error_reason_default_suggestion=İndirmeyi baştan başlatmayı deneyin. Sorun devam ederse internetinizi ve indirme bağlantısını kontrol edin. Bir hata olduğunu düşünüyorsanız lütfen bize bildirin.
